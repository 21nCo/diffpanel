name: Windows process lifecycle

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/windows-process.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-process-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  process-tree:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build esbuild native binary
        run: pnpm rebuild esbuild
      - name: Test Windows process lifecycle
        run: pnpm --filter @diffpanel/git exec vitest run src/process.test.ts src/windows-process.test.ts
