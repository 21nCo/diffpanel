name: Publish tagged package

on:
  push:
    tags:
      - 'devroll-v*.*.*'
      - 'diffpanel-v*.*.*'
      - 'diffpanel-generation-v*.*.*'
      - 'diffpanel-git-v*.*.*'
      - 'diffpanel-presentation-v*.*.*'
      - 'diffpanel-storage-v*.*.*'
      - 'iterbar-v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag in the form <package-slug>-v<version>'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    outputs:
      npm_tag: ${{ steps.resolve.outputs.npm_tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Require the run to belong to the release tag commit
        shell: bash
        run: |
          set -euo pipefail
          run_commit="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
          if [[ "${GITHUB_REF}" != "refs/tags/${RELEASE_TAG}" || "${run_commit}" != "$(git rev-parse HEAD)" ]]; then
            echo "This run's ref/commit (${GITHUB_REF} at ${run_commit}) is not the checked-out release tag ${RELEASE_TAG}. Dispatch on the tag (gh workflow run publish-tag.yml --ref ${RELEASE_TAG} -f release_tag=${RELEASE_TAG}) or push the tag again, so npm provenance records the commit that is published." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.0
          package-manager-cache: false # pnpm is installed in the next step
          registry-url: https://registry.npmjs.org

      - name: Install pinned package manager
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Resolve publish target
        id: resolve
        run: node ./scripts/resolve-release-tag.mjs "${RELEASE_TAG}"

      - name: Verify checked out tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint source and release scripts
        run: pnpm lint

      - name: Build audited native dependencies
        run: pnpm rebuild esbuild

      - name: Build storage native dependency
        if: steps.resolve.outputs.pkg_name == '@diffpanel/storage'
        run: pnpm --filter @diffpanel/storage rebuild better-sqlite3

      - name: Build package
        env:
          PACKAGE_PATH: ${{ steps.resolve.outputs.pkg_path }}
        run: pnpm --filter "./${PACKAGE_PATH}..." build

      - name: Test package
        env:
          PACKAGE_PATH: ${{ steps.resolve.outputs.pkg_path }}
        run: pnpm --filter "./${PACKAGE_PATH}" test

      - name: Pack package
        id: pack
        working-directory: ${{ steps.resolve.outputs.pkg_path }}
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="${RUNNER_TEMP}/diffpanel-pack"
          mkdir -p "${pack_dir}"
          npm pack --pack-destination "${pack_dir}" --json
          mapfile -t tarballs < <(find "${pack_dir}" -maxdepth 1 -type f -name '*.tgz' -print)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one package tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          echo "tarball=${tarballs[0]}" >> "${GITHUB_OUTPUT}"

      - name: Verify clean external install
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          cd "${fixture_dir}"
          npm init --yes >/dev/null
          npm install --ignore-scripts --package-lock=false "${{ steps.pack.outputs.tarball }}"
          if [[ "${{ steps.resolve.outputs.pkg_name }}" == "@diffpanel/storage" ]]; then
            npm rebuild better-sqlite3
          fi
          node --input-type=module --eval 'await import(process.argv[1])' "${{ steps.resolve.outputs.pkg_name }}"

      - name: Hand the package to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Setup npm with trusted publishing
        run: npm install --global npm@11.21.0 --ignore-scripts --registry=https://registry.npmjs.org

      - name: Download the package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package

      - name: Publish package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find "${RUNNER_TEMP}/npm-package" -maxdepth 1 -type f -name '*.tgz')
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one package tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          npm publish "${tarballs[0]}" --access public --tag "${NPM_TAG}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ needs.build.outputs.npm_tag }}
