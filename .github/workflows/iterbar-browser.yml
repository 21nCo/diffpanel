name: Iterbar browser tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: iterbar-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Playwright Chromium (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.0
          package-manager-cache: false # pnpm is installed in the next step
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build audited native dependencies
        run: pnpm -r rebuild esbuild
      - name: Install Chromium
        run: pnpm --filter @iterbar/bar exec playwright install --with-deps chromium
      - name: Run the bar's browser tests
        env:
          CI: "true"
        run: pnpm --filter @iterbar/bar test:browser
      - name: Keep the Playwright report of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iterbar-bar-playwright-${{ matrix.os }}
          path: |
            products/iterbar/bar/playwright-report
            products/iterbar/bar/test-results
          if-no-files-found: ignore
          retention-days: 7
